[project]
name = "sleeper-assistant"
version = "0.1.0"
description = "Sleeper fantasy football assistant: consensus rankings, waivers, trades, odds and recaps."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "sqlalchemy>=2.1.4",
    "tzdata>=2024.1",  # time zone data for kickoff times (not bundled on Windows)
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_assistant"]

[tool.ruff]
extend-exclude = ["migrations"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sleeper_assistant --cov-report=term-missing --cov-fail-under=80 -m 'not live'"
markers = ["live: hits the real network; skipped in CI"]

[tool.coverage.run]
source = ["src"]
