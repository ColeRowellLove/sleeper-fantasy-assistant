name: Label PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write access, so this job never checks out or runs PR code;
      # it only reads the labeler config from the base branch.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
