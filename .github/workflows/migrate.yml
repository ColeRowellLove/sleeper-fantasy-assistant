name: Migrate database

# Applies Alembic migrations to the Neon database. Uses the direct (unpooled) connection because
# schema changes should not go through the pooler. Run it manually (Actions tab -> Run workflow)
# or let it run when main changes.
on:
  push:
    branches: [main]
    paths: ["backend/migrations/**", "backend/src/sleeper_assistant/db.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Check the database secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL_UNPOOLED is not set."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run alembic upgrade head
      - run: uv run alembic current
