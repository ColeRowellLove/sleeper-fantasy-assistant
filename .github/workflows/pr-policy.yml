name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      # Values go through env vars, never interpolated into the script (avoids injection).
      - name: Check title, branch, base and linked issue
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          fail=0
          err() { echo "::error::$1"; fail=1; }

          title_re='^(feat|fix|chore|docs|test|refactor|perf|ci|build|revert)(\([a-z0-9._-]+\))?!?: .+'
          [[ "$TITLE" =~ $title_re ]] || err "PR title must follow Conventional Commits (e.g. 'feat: add waiver alerts')."

          branch_re='^(feature|bugfix|chore|docs|refactor|test|hotfix)/[a-z0-9._-]+$'
          is_dependabot=0; [[ "$HEAD" == dependabot/* || "$ACTOR" == "dependabot[bot]" ]] && is_dependabot=1
          is_release=0; [[ "$HEAD" == "develop" && "$BASE" == "main" ]] && is_release=1

          if [[ $is_dependabot -eq 0 && $is_release -eq 0 ]]; then
            [[ "$HEAD" =~ $branch_re ]] || err "Branch '$HEAD' must be feature/, bugfix/, chore/, docs/, refactor/, test/ or hotfix/ followed by a short-name."
          fi

          if [[ "$BASE" == "main" && $is_release -eq 0 && "$HEAD" != hotfix/* ]]; then
            err "Only develop (release) or hotfix/* branches may target main; target develop instead."
          fi

          if [[ $is_dependabot -eq 0 && $is_release -eq 0 ]]; then
            refs=$(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u)
            count=$(printf '%s' "$refs" | grep -c . || true)
            if [[ $count -eq 0 ]]; then
              err "PR description must link its issue with 'Closes #<number>'."
            elif [[ $count -gt 1 ]]; then
              err "One issue per PR: found $count closing references ($(echo $refs | tr '\n' ' '))."
            fi
          fi

          exit $fail
