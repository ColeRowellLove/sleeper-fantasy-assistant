name: Screenshots

# Lightweight PR screenshots for frontend changes. Not a required check; download the artifact
# from the run and attach images to the PR description.
on:
  pull_request:
    branches: [main, develop]
    paths: ["frontend/**"]

permissions:
  contents: read

jobs:
  screenshots:
    name: Frontend screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: frontend/screenshots/*.png
          retention-days: 7
