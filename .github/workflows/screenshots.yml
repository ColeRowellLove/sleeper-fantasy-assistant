name: Screenshots

# Every UI or API change gets phone and desktop screenshots of every page, shot against the sample
# league (made-up data, no network), and a layout check at phone width. The images are posted on
# the pull request; the job fails on a new layout problem. Mark "Frontend screenshots" as a
# required check in the branch protection settings to make it block merging.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, closed]
    paths: ["frontend/**", "backend/**", ".github/workflows/screenshots.yml"]

permissions:
  contents: read

jobs:
  screenshots:
    name: Frontend screenshots
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API with the sample league
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./preview.db
        run: |
          uv python install 3.12
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m sleeper_assistant.sample_league
          nohup uv run uvicorn sleeper_assistant.api:app --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Screenshots and layout checks
        working-directory: frontend
        env:
          API_URL: http://localhost:8000
        run: npm run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-screenshots
          path: |
            frontend/screenshots/*.png
            frontend/screenshots/layout-problems.txt
          retention-days: 14

  # A separate job holds the write token: it runs the script from the base branch, never code from
  # the pull request, and only handles the pictures the first job made.
  post:
    name: Post screenshots
    needs: screenshots
    if: always() && needs.screenshots.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # the pictures go to a screenshots/pr-<n> branch
      pull-requests: write # and are linked in a comment
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: frontend-screenshots
          path: shots
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # the script comes from the base branch, so the first PR that adds it has none yet
          if [ -x scripts/post-pr-screenshots.sh ]; then
            scripts/post-pr-screenshots.sh shots "$PR"
          else
            echo "::notice::scripts/post-pr-screenshots.sh is not on the base branch yet; nothing posted"
          fi

  cleanup:
    name: Remove screenshot branch
    permissions:
      contents: write
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/screenshots/pr-${PR}" || true
