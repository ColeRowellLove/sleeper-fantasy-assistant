name: Bug report
description: Something is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: context
    attributes:
      label: Context
      description: League settings, week, browser or API endpoint involved. Never paste secrets.
